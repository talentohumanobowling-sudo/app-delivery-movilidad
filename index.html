<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLEGANDO - Red Integral de Movilidad y Logística</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col pb-20">

    <!-- Header Principal -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-red-600 text-white p-2 rounded-lg shadow">
                    <i class="fa-solid fa-route"></i>
                </div>
                <span class="font-bold text-lg tracking-wide">LLEGANDO</span>
            </div>
            <div class="flex items-center space-x-3">
                <div class="text-right">
                    <span class="text-[10px] text-slate-400 font-semibold block uppercase">Tasa BCV Oficial</span>
                    <span class="text-xs sm:text-sm font-extrabold text-red-400" id="bcv-display">Bs. 36.50</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Navegación de Roles -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-16 z-20 overflow-x-auto">
        <div class="max-w-7xl mx-auto px-4 flex space-x-2 py-2">
            <button onclick="cambiarPortal('cliente')" id="btn-cliente" class="px-4 py-2 rounded-xl text-xs font-bold bg-red-600 text-white transition whitespace-nowrap"><i class="fa-solid fa-user mr-1"></i> Portal Cliente</button>
            <button onclick="cambiarPortal('prestador')" id="btn-prestador" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 transition whitespace-nowrap"><i class="fa-solid fa-id-badge mr-1"></i> Portal Prestador</button>
            <button onclick="cambiarPortal('aliado')" id="btn-aliado" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 transition whitespace-nowrap"><i class="fa-solid fa-store mr-1"></i> Aliado Comercial</button>
            <button onclick="cambiarPortal('admin')" id="btn-admin" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 transition whitespace-nowrap"><i class="fa-solid fa-gauge-high mr-1"></i> Panel Admin</button>
        </div>
    </nav>

    <!-- Contenedor de Vistas -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">

        <!-- 1. PORTAL CLIENTE -->
        <div id="portal-cliente" class="space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-bold text-slate-900 text-lg flex items-center"><i class="fa-solid fa-taxi text-red-600 mr-2"></i> Solicitar Nuevo Servicio</h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tu Nombre Completo *</label>
                        <input type="text" id="cli-nombre" placeholder="Ej: Carlos Pérez" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Número de Teléfono *</label>
                        <input type="text" id="cli-telefono" placeholder="Ej: 04121234567" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo de Servicio *</label>
                        <select id="cli-tipo" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                            <option value="Delivery">Delivery ($3.00)</option>
                            <option value="Mototaxi">Mototaxi ($2.50)</option>
                            <option value="Taxi / Carro">Taxi / Carro ($5.00)</option>
                            <option value="Flete">Flete ($15.00)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Método de Pago</label>
                        <select id="cli-pago" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                            <option value="Pago Móvil">Pago Móvil</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Zelle">Zelle</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Origen *</label>
                        <input type="text" id="cli-origen" placeholder="Dirección de recogida" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Destino *</label>
                        <input type="text" id="cli-destino" placeholder="Dirección de llegada" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                </div>

                <button onclick="registrarServicioCliente()" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold text-sm shadow hover:bg-red-700 transition">
                    Enviar Solicitud Ahora
                </button>
            </div>
        </div>

        <!-- 2. PORTAL PRESTADOR -->
        <div id="portal-prestador" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-bold text-slate-900 text-lg flex items-center"><i class="fa-solid fa-id-badge text-yellow-600 mr-2"></i> Panel Profesional del Prestador</h2>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Ingresa tu Nombre Autorizado</label>
                    <input type="text" id="pres-nombre" placeholder="Nombre de conductor..." class="w-full p-3 border rounded-xl text-sm outline-none">
                </div>
                <div class="p-4 bg-slate-50 rounded-xl border text-center text-xs text-slate-500">
                    Ingresa tu nombre para verificar tu estatus, billetera virtual y carreras asignadas.
                </div>
            </div>
        </div>

        <!-- 3. PORTAL ALIADO -->
        <div id="portal-aliado" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-bold text-slate-900 text-lg flex items-center"><i class="fa-solid fa-store text-green-600 mr-2"></i> Portal de Aliados Comerciales</h2>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Número de Suscripción (Ej: ALIADO-101)</label>
                    <input type="text" id="aliado-sus" placeholder="ALIADO-..." class="w-full p-3 border rounded-xl text-sm outline-none">
                </div>
