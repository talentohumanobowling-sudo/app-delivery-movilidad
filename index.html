<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLEGANDO - Red Integral de Movilidad y Logística</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col pb-24">

    <!-- Barra Superior -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-red-600 text-white p-2 rounded-lg shadow">
                    <i class="fa-solid fa-route"></i>
                </div>
                <span class="font-bold text-lg tracking-wide">LLEGANDO</span>
            </div>
            <div class="flex items-center space-x-3">
                <div class="text-right cursor-pointer" onclick="cambiarTasaBCV()">
                    <span class="text-[10px] text-slate-400 font-semibold block uppercase">Tasa BCV Oficial</span>
                    <span class="text-xs sm:text-sm font-extrabold text-red-400" id="bcv-display">Bs. 884.75</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Navegación por Portales -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-16 z-20 overflow-x-auto">
        <div class="max-w-7xl mx-auto px-4 flex space-x-2 py-2">
            <button onclick="cambiarPortal('cliente')" id="btn-cliente" class="px-4 py-2 rounded-xl text-xs font-bold bg-red-600 text-white transition whitespace-nowrap shadow-sm"><i class="fa-solid fa-user mr-1"></i> 1. Portal Cliente</button>
            <button onclick="cambiarPortal('prestador')" id="btn-prestador" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 transition whitespace-nowrap"><i class="fa-solid fa-id-badge mr-1"></i> 2. Portal Prestador</button>
            <button onclick="cambiarPortal('aliado')" id="btn-aliado" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 transition whitespace-nowrap"><i class="fa-solid fa-store mr-1"></i> 3. Aliado Comercial</button>
            <button onclick="cambiarPortal('admin')" id="btn-admin" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 transition whitespace-nowrap relative"><i class="fa-solid fa-gauge-high mr-1"></i> 4. Panel Gerencial <span id="admin-badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[9px] px-1.5 py-0.2 rounded-full hidden">0</span></button>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">

        <!-- ================= 1. PORTAL DE CLIENTE ================= -->
        <div id="portal-cliente" class="space-y-4">
            
            <!-- Pestañas internas del cliente -->
            <div class="flex space-x-2 border-b pb-2">
                <button onclick="verTabCliente('solicitar')" id="tab-cli-solicitar" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-red-600 text-white">Solicitar Servicio</button>
                <button onclick="verTabCliente('mis-servicios')" id="tab-cli-mis-servicios" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-200 text-slate-700">Mis Servicios / Alertas de Pago</button>
            </div>

            <!-- TAB 1: FORMULARIO DE SOLICITUD -->
            <div id="subtab-solicitar" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-bold text-slate-900 text-lg flex items-center"><i class="fa-solid fa-taxi text-red-600 mr-2"></i> Solicitar Servicio de Movilidad o Logística</h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre y Apellido *</label>
                        <input type="text" id="cli-nombre" placeholder="Ej: Juan Pérez" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono de Contacto (Para consultar estatus) *</label>
                        <input type="text" id="cli-telefono" placeholder="Ej: 04121234567" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo de Servicio *</label>
                        <select id="cli-tipo" onchange="actualizarCotizacion()" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                            <option value="Taxi">Taxi / Movilidad (Auto) - $5.00</option>
                            <option value="Mototaxi">Mototaxi - $2.50</option>
                            <option value="Delivery">Delivery / Paquetería - $3.00</option>
                            <option value="Fletes">Fletes y Carga - $15.00</option>
                            <option value="Encomiendas">Encomiendas - $2.50</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Método de Pago Preferido</label>
                        <select id="cli-pago" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                            <option value="Pago Móvil">Pago Móvil (Oficial LLEGANDO)</option>
                            <option value="Efectivo">Efectivo USD / Bs</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Punto de Origen *</label>
                        <input type="text" id="cli-origen" placeholder="Dirección de recogida" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Punto de Destino *</label>
                        <input type="text" id="cli-destino" placeholder="Dirección de llegada" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                </div>

                <div class="p-4 bg-red-50 border border-red-100 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-xs text-red-600 font-bold block uppercase">Cotización estimada</span>
                        <span class="text-lg font-extrabold text-slate-900" id="cotizacion-usd">$5.00 USD</span>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-slate-500 font-semibold block uppercase">Monto Estimado BCV</span>
                        <span class="text-sm font-bold text-red-600" id="cotizacion-bs">Bs. 4,423.75</span>
                    </div>
                </div>

                <button onclick="enviarSolicitudCliente()" class="w-full bg-red-600 text-white py-3.5 rounded-xl font-bold text-sm shadow hover:bg-red-700 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Confirmar y Enviar Solicitud</span>
                </button>
            </div>

            <!-- TAB 2: CONSULTA DE SERVICIOS Y ALERTAS DE PAGO MÓVIL -->
            <div id="subtab-mis-servicios"
